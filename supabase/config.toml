# ============================================================
# Supabase CLI project configuration
# BNI IDEAL Mentor System
# ============================================================
# Full reference: https://supabase.com/docs/guides/cli/config

[api]
enabled      = true
port         = 54321
schemas      = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows     = 1000

[api.tls]
enabled = false   # true in production (Supabase cloud handles this)

[db]
port         = 54322
shadow_port  = 54320
major_version = 15

[db.pooler]
enabled       = false
port          = 54329
pool_mode     = "transaction"
default_pool_size = 20
max_client_conn   = 100

[realtime]
enabled = true
# No realtime tables needed currently; enable per-table when LINE Bot needs push

[studio]
enabled  = true
port     = 54323
api_url  = "http://localhost"
openai_api_key = "env(OPENAI_API_KEY)"   # for Studio AI features (optional)

[inbucket]
enabled   = true
port      = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled         = true
file_size_limit = "50MiB"   # for check-in PDF uploads

[storage.image_transformation]
enabled = false

[auth]
enabled     = true
# PIN-based auth: Supabase Auth is NOT used for login.
# Auth is handled by fn_verify_pin() in Edge Functions.
# Disable public signup — no email/password accounts.
site_url                   = "http://localhost:3000"
additional_redirect_urls   = ["https://localhost:3000"]
jwt_expiry                 = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval  = 10
enable_signup              = false   # PIN-based only
enable_anonymous_sign_ins  = false
minimum_password_length    = 6

[auth.email]
enable_signup         = false
enable_confirmations  = false
secure_password_change = false
max_frequency         = "1s"

[auth.sms]
enable_signup         = false

[edge_runtime]
enabled = true
policy  = "per_worker"
inspector_port = 8083

[analytics]
enabled  = false
# Enable when usage metrics are needed

[experimental]
orioledb_version = ""
s3_host          = "env(S3_HOST)"
s3_region        = "env(S3_REGION)"
s3_access_key    = "env(S3_ACCESS_KEY)"
s3_secret_key    = "env(S3_SECRET_KEY)"

[functions.line-webhook]
verify_jwt = false

[functions.cron-jobs]
verify_jwt = false

[functions.liff-api]
verify_jwt = false
