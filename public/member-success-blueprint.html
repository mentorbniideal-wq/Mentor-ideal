<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Member Success Blueprint · BNI IDEAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f1713;--panel:#fbf7ee;--card:#fffdf7;--ink:#17231e;--muted:#66736b;--line:#e6ddc9;--gold:#c7a76a;--green:#164c3f;--green2:#0f3b31;--red:#b45252;--soft:#f3ead8;--ok:#2f8c5b}
    *{box-sizing:border-box}
    body{margin:0;font-family:Prompt,system-ui,sans-serif;background:radial-gradient(circle at 80% 0%,rgba(199,167,106,.22),transparent 34%),linear-gradient(135deg,#0d1712,#16241d 48%,#0c1411);color:var(--ink);min-height:100svh}
    .wrap{max-width:720px;margin:0 auto;padding:18px 14px 32px}
    .hero{background:linear-gradient(160deg,var(--green),var(--green2));color:#fff;border-radius:28px;padding:24px 22px;box-shadow:0 22px 60px rgba(0,0,0,.28);position:relative;overflow:hidden}
    .hero:after{content:"";position:absolute;right:-80px;top:-90px;width:220px;height:220px;border:1px solid rgba(199,167,106,.45);border-radius:999px}
    .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#dbc58f;font-weight:800}
    h1{font-size:30px;line-height:1.08;margin:10px 0 8px;font-weight:800}
    .sub{color:rgba(255,255,255,.76);font-size:13px;line-height:1.7}
    .panel{background:var(--panel);border:1px solid rgba(199,167,106,.28);border-radius:28px;margin-top:14px;box-shadow:0 18px 50px rgba(0,0,0,.22);overflow:hidden}
    .top{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.45)}
    .avatar{width:42px;height:42px;border-radius:16px;background:var(--green);color:#dbc58f;display:grid;place-items:center;font-weight:800}
    .who{flex:1;min-width:0}.who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who span{font-size:11px;color:var(--muted)}
    .progress{height:6px;background:#e8dfca}.bar{height:100%;background:linear-gradient(90deg,var(--gold),#e8ce85);width:16.6%;transition:.25s}
    .content{padding:18px 16px 20px}
    .step{display:none}.step.on{display:block;animation:fade .18s ease}@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
    .step h2{font-size:20px;margin:0 0 6px;color:var(--green);line-height:1.25}.hint{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:16px}
    label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px;color:#31433a}
    input,textarea,select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;font:inherit;font-size:15px;color:var(--ink);outline:none}
    textarea{min-height:110px;resize:vertical;line-height:1.65}
    input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,167,106,.18)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .calc{background:#0f3b31;color:#fff;border-radius:20px;padding:14px;margin:16px 0}.calc small{display:block;color:#dbc58f;font-size:11px;margin-bottom:4px}.calc b{font-size:25px}
    .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
    .metric{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}.metric span{display:block;font-size:11px;color:var(--muted)}.metric b{font-size:20px;color:var(--green)}
    .chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font-size:12px;color:#35463d;cursor:pointer;user-select:none}.chip.on{background:var(--green);border-color:var(--green);color:#fff}.chip.single.on{background:var(--gold);border-color:var(--gold);color:#17120a}
    .smartpick{background:#fffaf0;border:1px solid rgba(199,167,106,.34);border-radius:18px;padding:12px;margin:10px 0 14px}.smartpick .sp-title{font-size:12px;font-weight:800;color:var(--green);margin-bottom:8px}.smartpick .sp-title span{font-weight:500;color:var(--muted)}.smartpick .sp-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.smartpick input{padding:10px 12px;border-radius:12px;font-size:13px}.smartpick .add{border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-size:12px;font-weight:800;padding:0 13px;cursor:pointer}.smartpick .near{font-size:11px;color:#7a6742;line-height:1.55;margin-top:8px}.smartpick .near button{border:1px solid rgba(199,167,106,.5);background:#fffdf7;border-radius:999px;padding:5px 8px;margin:4px 4px 0 0;font:inherit;font-size:11px;font-weight:800;color:var(--green);cursor:pointer}
    .coach{background:linear-gradient(180deg,#fffaf0,#f5ecdc);border:1px solid rgba(199,167,106,.38);border-radius:18px;padding:13px 13px;margin:8px 0 14px;color:#31433a;font-size:12px;line-height:1.75}
    .coach b{color:var(--green)}.coach .title{font-weight:800;color:var(--green);font-size:13px;margin-bottom:3px}.coach .mini{background:rgba(255,255,255,.58);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
    .coach .row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}.coach .row.two{grid-template-columns:1fr 1fr}.coach .row input{padding:10px 11px;border-radius:12px;font-size:13px}
    .goalcoach{background:linear-gradient(160deg,#123e34,#0e2f28);color:#fff;border:1px solid rgba(199,167,106,.34);border-radius:20px;padding:14px;margin:14px 0;box-shadow:0 14px 34px rgba(15,59,49,.22);font-size:12px;line-height:1.75}
    .goalcoach.light{background:linear-gradient(180deg,#fffdf7,#f3ead8);color:#31433a;box-shadow:none}
    .goalcoach .gc-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:9px}
    .goalcoach .gc-title{font-weight:800;color:#e8ce85;font-size:13px}.goalcoach.light .gc-title{color:var(--green)}
    .goalcoach .gc-pill{border:1px solid rgba(232,206,133,.46);background:rgba(232,206,133,.13);color:#f5e3a8;border-radius:999px;padding:4px 9px;font-weight:800;white-space:nowrap}.goalcoach.light .gc-pill{color:var(--green);background:#fff8e6;border-color:rgba(199,167,106,.38)}
    .goalcoach .gc-score{font-size:34px;line-height:1;font-weight:800;color:#e8ce85}.goalcoach.light .gc-score{color:var(--green)}
    .goalcoach ul{margin:8px 0 0;padding-left:18px}.goalcoach li{margin:5px 0}
    .goalcoach .gc-note{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:10px;margin-top:10px}.goalcoach.light .gc-note{background:#fffaf0;border-color:var(--line)}
    .goalcoach .gc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.goalcoach .gc-box{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:10px}.goalcoach.light .gc-box{background:#fffdf7;border-color:var(--line)}
    .goalcoach .gc-box span{display:block;color:rgba(255,255,255,.7);font-size:11px}.goalcoach.light .gc-box span{color:var(--muted)}.goalcoach .gc-box b{font-size:17px;color:#e8ce85}.goalcoach.light .gc-box b{color:var(--green)}
    .quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.qbtn{border:1px solid rgba(199,167,106,.45);background:#fffdf7;color:#31433a;border-radius:999px;padding:8px 10px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}
    .result-note{background:#0f3b31;color:#fff;border-radius:18px;padding:13px 14px;line-height:1.7;font-size:12px;margin:14px 0}.result-note b{font-size:19px;color:#e8ce85}.result-note span{color:rgba(255,255,255,.76)}
    details.learn{margin-top:9px;color:var(--muted)}details.learn summary{cursor:pointer;font-weight:800;color:#7a6742}details.learn div{padding-top:7px}
    .warn{display:none;background:#fff4d7;border:1px solid #e0c36f;color:#664b00;border-radius:16px;padding:11px 12px;font-size:12px;line-height:1.6;margin:12px 0}.warn.on{display:block}
    .summary{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;line-height:1.7;font-size:13px}.summary h3{margin:0 0 8px;color:var(--green)}
    .actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:16px;padding:13px 14px;font:inherit;font-weight:800;cursor:pointer}.ghost{background:#eee4d1;color:#3b453f}.main{background:var(--green);color:#fff;flex:1}.main.gold{background:linear-gradient(135deg,#c7a76a,#e5c982);color:#17120a}.btn:disabled{opacity:.55;cursor:not-allowed}
    .state{padding:24px 18px;text-align:center;color:var(--muted);line-height:1.7}.state b{color:var(--green)}
    .toast{position:fixed;left:14px;right:14px;bottom:16px;background:#121c17;color:#fff;border:1px solid rgba(199,167,106,.35);border-radius:18px;padding:13px 14px;font-size:13px;box-shadow:0 18px 45px rgba(0,0,0,.3);display:none;z-index:10}.toast.on{display:block}
    @media(max-width:480px){.wrap{padding:12px 10px 24px}.hero{border-radius:24px;padding:22px 18px}h1{font-size:27px}.grid2,.metrics{grid-template-columns:1fr}.content{padding:16px 14px 18px}.actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--panel) 30%);padding-top:18px}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow">BNI IDEAL · 2026</div>
      <h1>Member Success Blueprint</h1>
      <div class="sub">แผนธุรกิจประจำปีจาก Advanced MSP ใช้เวลาประมาณ 5 นาที เพื่อให้ Mentor และ Growth ช่วยสนับสนุนได้ตรงจุดขึ้น</div>
    </section>

    <section class="panel">
      <div class="top">
        <div class="avatar">MSB</div>
        <div class="who"><b id="memberName">กำลังตรวจสอบลิงก์ส่วนตัว...</b><span id="memberMeta">ระบบจะดึงชื่อและทีมจากข้อมูลสมาชิกเดิม</span></div>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="content" id="app">
        <div class="state">กำลังตรวจสอบลิงก์ส่วนตัว...</div>
      </div>
    </section>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    var API='https://itwyjhlfemxsfbimshby.supabase.co/functions/v1/api';
    var ANON='sb_publishable_vTX2pRpd9axDyAuMHTVhDQ_zfS1VE-j';
    var HEADERS={'Content-Type':'application/json','Authorization':'Bearer '+ANON};
    var step=0,formToken='',member=null,blueprint=null,year=new Date().getFullYear();
    var data={blueprintYear:year,total_sales_target_year:'',expected_sales_from_bni_year:'',existing_customer_revenue_from_bni:'',new_customer_revenue_from_bni:'',average_customer_value_year:'',conversion_rate_percent:'',looking_for_categories:[],looking_for_detail:'',power_team_categories:[],power_team_detail:'',personal_goal_category:'',personal_goal_detail:''};
    var helperState={avgMonthly:'',convReferrals:'10',convClosed:'3'},categorySuggestions={looking_for:[],power_team:[]},categoryDraft={looking_for_categories:'',power_team_categories:''};
    var LOOK=['SME Owner','เจ้าของกิจการ','HR / People','Finance / Accounting','Real Estate','Health / Wellness','Education','Retail / F&B','Marketing / Media','Legal / Consulting','IT / Digital','ครอบครัว/เพื่อนของลูกค้า'];
    var POWER=['Finance','Legal','Real Estate','Health','Marketing','Construction','Hospitality','Education','Technology','Insurance','Automotive','Lifestyle'];
    var PERSONAL=['เพิ่มยอดขาย','เพิ่ม Referral คุณภาพ','สร้าง Power Team','พัฒนาการ Follow-up','เพิ่ม Visibility','สร้างระบบทีมขาย','วางแผนการเงิน','พัฒนาทักษะ Networking'];
    function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function n(v){var x=Number(String(v||'').replace(/[,฿\\s]/g,''));return isFinite(x)?x:0;}
    function fmt(v){return n(v).toLocaleString('th-TH',{maximumFractionDigits:1});}
    function money(v){return '฿'+n(v).toLocaleString('th-TH',{maximumFractionDigits:0});}
    function toast(s){var t=document.getElementById('toast');t.textContent=s;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2600);}
    function call(action,p,cb){fetch(API,{method:'POST',headers:HEADERS,body:JSON.stringify(Object.assign({action:action,token:formToken},p||{}))}).then(function(r){return r.json();}).then(cb).catch(function(e){cb({ok:false,error:e.message});});}
    function calc(){
      var total=n(data.total_sales_target_year), bni=n(data.expected_sales_from_bni_year), avg=n(data.average_customer_value_year), conv=n(data.conversion_rate_percent);
      var cust=avg>0?Math.ceil(bni/avg):0;
      var ref=conv>0?Math.ceil(cust/(conv/100)):0;
      return {pct:total>0?bni/total*100:0,cust:cust,ref:ref,month:ref/12,week:ref/52};
    }
    function persist(){try{localStorage.setItem('msb_draft_'+year,JSON.stringify(data));}catch(e){}}
    function hydrateDraft(){try{var raw=localStorage.getItem('msb_draft_'+year);if(raw)Object.assign(data,JSON.parse(raw));}catch(e){}}
    function loadServer(){
      call('getMemberSuccessBlueprintByToken',{},function(r){
        if(!r.ok){showState('<b>ลิงก์นี้ยังใช้งานไม่ได้</b><br>'+esc(r.error||'ลิงก์ไม่ถูกต้องหรือหมดอายุ')+'<br><br>กรุณาขอลิงก์ใหม่จาก MC หรือ Growth หรือพิมพ์ <b>Goal</b> ใน LINE Official Account');return;}
        member=r.member||{};blueprint=r.blueprint||null;
        year=Number(r.blueprintYear)||year;
        data.blueprintYear=year;
        document.getElementById('memberName').textContent=(member.nickname||member.name||'สมาชิก BNI IDEAL');
        document.getElementById('memberMeta').textContent=(member.mentor_team?'ทีม '+member.mentor_team:'BNI IDEAL')+' · '+year;
        if(blueprint){
          Object.assign(data,{
            total_sales_target_year:blueprint.total_sales_target_year||'',
            expected_sales_from_bni_year:blueprint.expected_sales_from_bni_year||'',
            existing_customer_revenue_from_bni:blueprint.existing_customer_revenue_from_bni||'',
            new_customer_revenue_from_bni:blueprint.new_customer_revenue_from_bni||'',
            average_customer_value_year:blueprint.average_customer_value_year||'',
            conversion_rate_percent:blueprint.conversion_rate_percent||'',
            looking_for_categories:blueprint.looking_for_categories||[],
            looking_for_detail:blueprint.looking_for_detail||'',
            power_team_categories:blueprint.power_team_categories||[],
            power_team_detail:blueprint.power_team_detail||'',
            personal_goal_category:blueprint.personal_goal_category||'',
            personal_goal_detail:blueprint.personal_goal_detail||''
          });
        }else hydrateDraft();
        render();
        loadCategorySuggestions();
      });
    }
    function loadCategorySuggestions(){
      call('getMSBCategorySuggestions',{},function(r){
        if(!r||!r.ok)return;
        categorySuggestions=(r.suggestions||categorySuggestions);
        if(step===3||step===4)render();
      });
    }
    function showState(html){document.getElementById('app').innerHTML='<div class="state">'+html+'</div>';}
    function init(){
      try{formToken=new URLSearchParams(window.location.search).get('t')||'';}catch(e){formToken='';}
      if(!formToken){showState('<b>ไม่พบลิงก์ส่วนตัว</b><br>กรุณาเปิดจากลิงก์ที่ได้รับจาก MC / Growth หรือพิมพ์ <b>Goal</b> ใน LINE Official Account เพื่อขอลิงก์ใหม่');return;}
      loadServer();
    }
    function setVal(k,v){data[k]=v;persist();render();}
    function setInput(k,v){data[k]=v;persist();updateLive();}
    function setMonthlyTotal(v){data.total_sales_target_year=String(n(v)*12);persist();render();}
    function setBniPct(pct){var total=n(data.total_sales_target_year);if(!total){toast('กรอกยอดขายรวมทั้งปีก่อนครับ');return;}data.expected_sales_from_bni_year=String(Math.round(total*(pct/100)));persist();render();}
    function setAvgMonthlySpend(v){helperState.avgMonthly=String(v||'');data.average_customer_value_year=String(n(v)*12);persist();updateLive(true);}
    function setConversionCalc(k,v){helperState[k]=String(v||'');var ref=n(helperState.convReferrals),closed=n(helperState.convClosed);if(ref>0)data.conversion_rate_percent=String(Math.min(100,(closed/ref)*100).toFixed(1));persist();updateLive(true);}
    function toggleArr(k,v){var a=data[k]||[];data[k]=a.includes(v)?a.filter(function(x){return x!==v;}):a.concat([v]);persist();render();}
    function setSingle(k,v){data[k]=v;persist();render();}
    function normCat(s){return String(s||'').toLowerCase().replace(/[’']/g,'').replace(/&/g,'and').replace(/[^a-z0-9\u0E00-\u0E7F]+/g,'').trim();}
    function uniqueCats(base,extra){
      var seen={},out=[];
      (base||[]).concat(extra||[]).forEach(function(x){
        x=String(x&&x.name||x||'').trim();var k=normCat(x);
        if(x&&k&&!seen[k]){seen[k]=1;out.push(x);}
      });
      return out;
    }
    function chips(list,k,single){return '<div class="chips">'+list.map(function(x){var on=single?data[k]===x:(data[k]||[]).includes(x);return '<button type="button" class="chip '+(single?'single ':'')+(on?'on':'')+'" onclick=\''+(single?'setSingle':'toggleArr')+'('+JSON.stringify(k)+','+JSON.stringify(x)+')\'>'+esc(x)+'</button>';}).join('')+'</div>';}
    function categorySmartPick(type,k){
      var items=(categorySuggestions[type]||[]).filter(function(x){return x&&x.name;});
      var top=items.slice(0,10), val=categoryDraft[k]||'', near=[];
      if(val.trim()){
        var nk=normCat(val);
        near=items.filter(function(x){var ck=normCat(x.name);return ck&&nk&&(ck.indexOf(nk)>=0||nk.indexOf(ck)>=0);}).slice(0,5);
      }
      var html='<div class="smartpick"><div class="sp-title">คำที่ Chapter ใช้บ่อย <span>เลือกคำเดียวกันจะช่วยให้ Growth เห็น demand ชัดขึ้น</span></div>';
      html+=top.length?'<div class="chips">'+top.map(function(x){var on=(data[k]||[]).includes(x.name);return '<button type="button" class="chip '+(on?'on':'')+'" onclick="toggleArr('+JSON.stringify(k)+','+JSON.stringify(x.name)+')">'+esc(x.name)+' · '+x.count+'</button>';}).join('')+'</div>':'<div class="hint" style="margin:0">ยังไม่มีคำยอดนิยมจาก Blueprint ก่อนหน้า</div>';
      html+='<div class="sp-row"><input value="'+esc(val)+'" placeholder="เพิ่มคำเอง เช่น โรงงาน, เจ้าของบ้าน, HR Manager" oninput="categoryDraft['+JSON.stringify(k)+']=this.value"><button type="button" class="add" onclick="addCustomCategory('+JSON.stringify(k)+')">เพิ่ม</button></div>';
      if(near.length)html+='<div class="near">คำที่ใกล้เคียงกัน ลองเลือกคำเดิมเพื่อให้ข้อมูลรวมกันสวยขึ้น:<br>'+near.map(function(x){return '<button type="button" onclick="toggleArr('+JSON.stringify(k)+','+JSON.stringify(x.name)+')">'+esc(x.name)+' · '+x.count+'</button>';}).join('')+'</div>';
      html+='</div>';
      return html;
    }
    function addCustomCategory(k){
      var v=String(categoryDraft[k]||'').trim();
      if(!v){toast('พิมพ์คำที่อยากเพิ่มก่อนครับ');return;}
      var existing=uniqueCats(k==='looking_for_categories'?LOOK:POWER,categorySuggestions[k==='looking_for_categories'?'looking_for':'power_team']);
      var nk=normCat(v), close=existing.find(function(x){var ek=normCat(x);return ek&&nk&&(ek===nk||ek.indexOf(nk)>=0||nk.indexOf(ek)>=0);});
      if(close&&close!==v&&!confirm('มีคำที่ใกล้เคียงอยู่แล้ว: "'+close+'"\nกด OK เพื่อใช้คำนี้แทน จะช่วยให้ข้อมูลรวมกันตรงขึ้น'))return;
      categoryDraft[k]='';
      toggleArr(k,close||v);
    }
    function field(k,label,type,ph,helper){return '<label>'+label+'</label><input id="fld_'+esc(k)+'" inputmode="decimal" type="'+(type||'text')+'" value="'+esc(data[k])+'" placeholder="'+esc(ph||'')+'" oninput=\'setInput('+JSON.stringify(k)+',this.value)\'>'+(helper?'<div class="coach" id="'+helper+'">'+coach(helper)+'</div>':'');}
    function area(k,label,ph){return '<label>'+label+'</label><textarea placeholder="'+esc(ph||'')+'" oninput=\'setInput('+JSON.stringify(k)+',this.value)\'>'+esc(data[k])+'</textarea>';}
    function quickMonthly(){
      return '<div class="quick">'+[50000,80000,100000,150000,200000].map(function(v){return '<button type="button" class="qbtn" onclick="setMonthlyTotal('+v+')">'+fmt(v)+' / เดือน</button>';}).join('')+'</div>';
    }

      var pct=document.getElementById('pct');if(pct)pct.textContent=fmt(c.pct)+'%';
      var cust=document.getElementById('cust');if(cust)cust.textContent=fmt(c.cust);
      var ref=document.getElementById('ref');if(ref)ref.textContent=fmt(c.ref);
      var month=document.getElementById('month');if(month)month.textContent=fmt(c.month);
      var week=document.getElementById('week');if(week)week.textContent=fmt(c.week);
      var split=n(data.existing_customer_revenue_from_bni)+n(data.new_customer_revenue_from_bni), bni=n(data.expected_sales_from_bni_year);
      var sw=document.getElementById('splitWarn');if(sw){sw.className='warn '+(split&&bni&&Math.abs(split-bni)/bni>.1?'on':'');sw.textContent='ยอด Existing + New ยังไม่ใกล้เคียงกับยอดขายที่คาดหวังจาก BNI แต่สามารถบันทึกได้';}
      var lw=document.getElementById('logicWarn');if(lw){var msg=[];if(c.ref>100)msg.push('Referral ที่ต้องการมากกว่า 100 ใบ/ปี');if(n(data.conversion_rate_percent)<10&&n(data.conversion_rate_percent)>0)msg.push('Conversion ต่ำกว่า 10%');if(c.pct>50)msg.push('พึ่งพา BNI เกิน 50%');lw.className='warn '+(msg.length?'on':'');lw.innerHTML=msg.map(esc).join('<br>');}
      var avgMini=document.getElementById('avgMiniResult');if(avgMini)avgMini.textContent=money(data.average_customer_value_year);
      var convMini=document.getElementById('convMiniResult');if(convMini)convMini.textContent=fmt(data.conversion_rate_percent)+'%';
      var rn=document.getElementById('resultExplain');if(rn)rn.innerHTML=resultExplain();
      ['reality','feasibility','trigger','power','final'].forEach(function(k){var el=document.getElementById('goalCoach_'+k);if(el)el.innerHTML=goalCoachHtml(k);});
      if(skipCoach)return;
      ['h-total','h-bni','h-avg','h-conv','h-existing','h-new'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=coach(id);});
    }
    function validateStep(){
      if(step===0&&(!n(data.total_sales_target_year)||!n(data.expected_sales_from_bni_year)))return 'กรุณากรอกเป้ายอดขาย';
      if(step===0&&n(data.expected_sales_from_bni_year)>n(data.total_sales_target_year))return 'ยอดขายจาก BNI ไม่ควรเกินเป้ายอดขายรวม';
      if(step===1&&(!n(data.average_customer_value_year)||!n(data.conversion_rate_percent)||n(data.conversion_rate_percent)>100))return 'กรุณากรอกมูลค่าลูกค้าเฉลี่ยและ Conversion 1–100%';
      if(step===3&&(!(data.looking_for_categories||[]).length||!data.looking_for_detail.trim()))return 'กรุณาเลือกและอธิบายคนที่มองหา';
      if(step===4&&(!(data.power_team_categories||[]).length||!data.power_team_detail.trim()))return 'กรุณาเลือกและอธิบาย Power Team';
      if(step===5&&!data.personal_goal_category)return 'กรุณาเลือก Personal Goal';
      return '';
    }
    function next(){var e=validateStep();if(e){toast(e);return;}step=Math.min(6,step+1);render();}
    function back(){step=Math.max(0,step-1);render();}
    function saveFinal(){
      var e;for(var i=0;i<6;i++){step=i;e=validateStep();if(e){render();toast(e);return;}}
      step=6;render();
      var btn=document.getElementById('saveBtn');if(btn){btn.disabled=true;btn.textContent='กำลังบันทึก...';}
      call('saveMemberSuccessBlueprintByToken',Object.assign({},data,{status:'submitted'}),function(r){
        if(btn){btn.disabled=false;btn.textContent='บันทึกแผนธุรกิจ';}
        if(!r.ok){toast(r.error||'บันทึกไม่สำเร็จ');return;}
        blueprint=r.blueprint;try{localStorage.removeItem('msb_draft_'+year);}catch(e){}
        toast('บันทึกแผนธุรกิจเรียบร้อยครับ');
      });
    }
    function nav(final){return '<div class="actions">'+(step>0?'<button class="btn ghost" onclick="back()">ย้อนกลับ</button>':'')+(final?'<button class="btn main gold" id="saveBtn" onclick="saveFinal()">บันทึกแผนธุรกิจ</button>':'<button class="btn main" onclick="next()">ถัดไป</button>')+'</div>';}
    function render(){
      document.getElementById('bar').style.width=((Math.min(step+1,6)/6)*100)+'%';
      var c=calc(), html='';
      var legend='<div class="coach" style="margin-top:0"><b>วิธีดูช่องกรอก</b><br>ช่องที่มีคำว่า <b>ต้องกรอก/ต้องเลือก</b> คือข้อมูลที่ระบบจะบันทึก ส่วนช่องที่บอกว่า <b>ใช้ช่วยคำนวณ</b> เป็นตัวช่วยคิด ไม่ใช่ช่องบันทึกหลักครับ</div>';
      if(step===0)html='<div class="step on"><h2>1. Business Goal</h2>'+legend+'<div class="hint">เริ่มจากภาพใหญ่ก่อนครับ ปีนี้อยากให้ธุรกิจโตประมาณไหน และอยากให้ BNI ช่วยสร้างยอดขายส่วนไหน</div>'+field('total_sales_target_year','ยอดขายรวมทั้งปี (ต้องกรอกตรงนี้)','number','เช่น 1200000','h-total')+field('expected_sales_from_bni_year','ยอดขายที่คาดหวังจาก BNI (ต้องกรอกตรงนี้)','number','เช่น 240000','h-bni')+'<div class="calc"><small>BNI Contribution · สัดส่วนที่อยากให้ BNI ช่วย (ระบบคำนวณอัตโนมัติ)</small><b id="pct">'+fmt(c.pct)+'%</b></div><div id="goalCoach_reality">'+goalCoachHtml('reality')+'</div>'+nav(false)+'</div>';
      if(step===1)html='<div class="step on"><h2>2. Customer & Referral Guide</h2>'+legend+'<div class="hint">หน้านี้ช่วยแปลงเป้ายอดขายให้เป็นภาษาง่าย ๆ ว่าต้องการลูกค้ากี่ราย และควรได้รับ Referral ประมาณเท่าไร</div>'+field('average_customer_value_year','มูลค่าลูกค้าเฉลี่ยต่อปี (ต้องกรอกตรงนี้)','number','เช่น 30000','h-avg')+field('conversion_rate_percent','Conversion rate จาก Referral เป็นลูกค้า (%) (ต้องกรอกตรงนี้)','number','เช่น 30','h-conv')+'<div id="resultExplain">'+resultExplain()+'</div><div class="metrics"><div class="metric"><span>ลูกค้าที่ต้องการ (ระบบคำนวณอัตโนมัติ)</span><b id="cust">'+fmt(c.cust)+'</b></div><div class="metric"><span>Referral/ปี (ระบบคำนวณอัตโนมัติ)</span><b id="ref">'+fmt(c.ref)+'</b></div><div class="metric"><span>Referral/เดือน (ระบบคำนวณอัตโนมัติ)</span><b id="month">'+fmt(c.month)+'</b></div><div class="metric"><span>Referral/สัปดาห์ (ระบบคำนวณอัตโนมัติ)</span><b id="week">'+fmt(c.week)+'</b></div></div><div id="goalCoach_feasibility">'+goalCoachHtml('feasibility')+'</div><div class="warn" id="logicWarn"></div>'+nav(false)+'</div>';
      if(step===2)html='<div class="step on"><h2>3. Existing vs New Business</h2><div class="hint">แยกแบบง่าย ๆ ว่ายอดจาก BNI ปีนี้มาจากลูกค้าเดิมเท่าไร และต้องหาลูกค้าใหม่เพิ่มประมาณเท่าไร</div>'+field('existing_customer_revenue_from_bni','ยอดจากลูกค้าเดิมที่มาจาก BNI (ต้องกรอกตรงนี้)','number','เช่น 100000','h-existing')+field('new_customer_revenue_from_bni','ยอดจากลูกค้าใหม่ที่ต้องการจาก BNI (ต้องกรอกตรงนี้)','number','เช่น 140000','h-new')+'<div class="warn" id="splitWarn"></div>'+nav(false)+'</div>';
      if(step===3){var lookList=uniqueCats(LOOK,categorySuggestions.looking_for);html='<div class="step on"><h2>4. Looking For</h2><div class="hint">เลือกให้น้อยแต่ชัด เพื่อให้คนใน Chapter แนะนำได้ง่าย</div><label>หมวดคนที่กำลังมองหา (ต้องเลือกอย่างน้อย 1 ข้อ)</label>'+categorySmartPick('looking_for','looking_for_categories')+chips(lookList,'looking_for_categories')+area('looking_for_detail','รายละเอียดที่อยากให้ช่วยมองหา (ต้องกรอกตรงนี้)','เช่น เจ้าของโรงงาน 50–300 คน ที่กำลังทำประกันกลุ่ม / วางระบบ HR')+'<div id="goalCoach_trigger">'+goalCoachHtml('trigger')+'</div>'+nav(false)+'</div>';}
      if(step===4){var powerList=uniqueCats(POWER,categorySuggestions.power_team);html='<div class="step on"><h2>5. Power Team</h2><div class="hint">ใครคือกลุ่มอาชีพที่ช่วยส่งงานต่อกันได้จริง</div><label>หมวด Power Team (ต้องเลือกอย่างน้อย 1 ข้อ)</label>'+categorySmartPick('power_team','power_team_categories')+chips(powerList,'power_team_categories')+area('power_team_detail','รายละเอียด Power Team ที่อยากสร้าง (ต้องกรอกตรงนี้)','เช่น Real estate + loan + insurance + interior สำหรับลูกค้าซื้อบ้านใหม่')+'<div id="goalCoach_power">'+goalCoachHtml('power')+'</div>'+nav(false)+'</div>';}
      if(step===5)html='<div class="step on"><h2>6. Personal Goal</h2><div class="hint">เลือกเป้าหมายส่วนตัวหนึ่งเรื่องที่อยากให้ Mentor ช่วยติดตาม</div><label>Personal Goal (ต้องเลือกตรงนี้)</label>'+chips(PERSONAL,'personal_goal_category',true)+area('personal_goal_detail','รายละเอียดเพิ่มเติม (ไม่บังคับ)','เช่น อยากนัด 1-2-1 อย่างน้อยสัปดาห์ละ 2 ครั้ง')+nav(false)+'</div>';
      if(step===6)html='<div class="step on"><h2>Final Summary</h2><div class="summary"><h3>แผนธุรกิจ '+year+'</h3><div>ยอดขายรวม: ฿'+fmt(data.total_sales_target_year)+'</div><div>คาดหวังจาก BNI: ฿'+fmt(data.expected_sales_from_bni_year)+' ('+fmt(c.pct)+'%)</div><div>ต้องการลูกค้า '+fmt(c.cust)+' ราย · Referral '+fmt(c.ref)+' ใบ/ปี · '+fmt(c.week)+' ใบ/สัปดาห์</div><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><div><b>Looking For:</b> '+esc((data.looking_for_categories||[]).join(', '))+'</div><div>'+esc(data.looking_for_detail)+'</div><br><div><b>Power Team:</b> '+esc((data.power_team_categories||[]).join(', '))+'</div><div>'+esc(data.power_team_detail)+'</div><br><div><b>Personal Goal:</b> '+esc(data.personal_goal_category)+'</div><div>'+esc(data.personal_goal_detail)+'</div></div><div id="goalCoach_final">'+goalCoachHtml('final')+'</div><div class="warn on" id="logicWarn"></div>'+nav(true)+'</div>';
      document.getElementById('app').innerHTML=html;updateLive();
    }
    init();
  </script>
</body>
</html>
