<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c35"><title>MY IDEAL · Member Pulse</title><script src="/assets/js/runtime-config.js"></script><script src="/assets/js/runtime-client.js"></script><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai",sans-serif;color:#123c35;background:#f6f2e9}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);min-height:100vh}.card{width:min(620px,100%);margin:24px auto;background:#fff;border:1px solid #d9d2c5;border-radius:20px;padding:22px;box-shadow:0 14px 40px #123c3512}h1{font-size:24px;margin:4px 0}p{color:#59645f;line-height:1.6}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:#765d2e}label{display:block;margin:18px 0 7px;font-weight:700}input,select,textarea{width:100%;min-height:46px;border:1px solid #cfc6b6;border-radius:12px;padding:11px;font:inherit;color:inherit;background:white}textarea{min-height:100px}button{width:100%;min-height:48px;margin-top:14px;border:0;border-radius:12px;background:#123c35;color:white;font:700 15px inherit}button:disabled{opacity:.5}.status{min-height:24px;color:#59645f}.error{color:#a63f34}.done{padding:18px;background:#edf5f1;border-radius:14px}.progress{height:8px;width:100%;accent-color:#1f6f5d}
</style></head><body><main class="card"><div class="eyebrow">MY IDEAL · MEMBER PULSE</div><h1 id="title">กำลังโหลดแบบสอบถาม…</h1><p id="intro">แบบสอบถามสั้น ๆ เพื่อให้ทีมดูแลสมาชิกได้ตรงความต้องการ</p><div id="formRoot" aria-live="polite"></div><p class="status" id="status" role="status"></p></main><script>
(function(){'use strict';var root=document.getElementById('formRoot'),status=document.getElementById('status'),token=new URLSearchParams(location.search).get('token')||'',current=null,timer=0;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
async function api(action,extra){if(!window.MY_IDEAL_RUNTIME||!window.SUPABASE_API)throw Error('ระบบยังโหลดไม่พร้อม กรุณาลองใหม่');var r=await fetch(window.SUPABASE_API,{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SUPABASE_ANON},body:JSON.stringify(Object.assign({action:action,token:token},extra||{}))});var d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'ดำเนินการไม่สำเร็จ');return d}
function input(q,value){var id=String(q.id||'');if(!/^[a-z][a-z0-9_]{0,39}$/.test(id))return '';var req=q.required?' required':'';if(q.type==='scale')return '<label>'+esc(q.label)+(req?' *':'')+'</label><select name="'+id+'"'+req+'><option value="">เลือก 1–10</option>'+Array.from({length:10},function(_,i){var n=i+1;return '<option value="'+n+'"'+(Number(value)===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select>';if(q.type==='choice'&&Array.isArray(q.options))return '<label>'+esc(q.label)+(req?' *':'')+'</label><select name="'+id+'"'+req+'><option value="">เลือกคำตอบ</option>'+q.options.map(function(x){return '<option'+(value===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>';if(q.type==='text')return '<label>'+esc(q.label)+(req?' *':'')+'</label><textarea name="'+id+'" maxlength="1000"'+req+'>'+esc(value||'')+'</textarea>';return ''}
function read(){var fd=new FormData(root.querySelector('form')),a={};(current.template.questions||[]).forEach(function(q){var v=fd.get(q.id);if(v!=='')a[q.id]=q.type==='scale'?Number(v):v});return a}
function updateProgress(){var form=root.querySelector('form');if(!form||!current)return;var answered=Object.keys(read()).length,total=(current.template.questions||[]).length,p=form.querySelector('#pulseProgress'),text=form.querySelector('#pulseProgressText');if(p){p.max=total;p.value=answered}if(text)text.textContent='ตอบแล้ว '+answered+' / '+total+' ข้อ'}
function saveLater(){updateProgress();clearTimeout(timer);timer=setTimeout(async function(){try{await api('saveMemberPulseByToken',{answers:read()});status.textContent='บันทึกฉบับร่างแล้ว';}catch(e){status.textContent=e.message}},700)}
async function load(){if(!token){root.innerHTML='<p class="error">ลิงก์แบบสอบถามไม่ถูกต้องหรือไม่ครบถ้วน</p>';return}try{current=await api('getMemberPulseByToken');document.getElementById('title').textContent=current.template.title||'แบบสอบถามสมาชิก';var qs=current.template.questions||[],done=Boolean(current.campaign.completedAt||current.campaign.status==='completed');if(current.campaign.expired){root.innerHTML='<div class="done">ลิงก์หมดอายุแล้ว กรุณาติดต่อทีม Growth</div>';return}if(done){root.innerHTML='<div class="done">ส่งคำตอบแล้ว ขอบคุณที่ช่วยให้เราเข้าใจและดูแลสมาชิกได้ดียิ่งขึ้น 💛</div>';return}root.innerHTML='<p>คำถาม '+qs.length+' ข้อ · ใช้เวลาประมาณ 1–2 นาที</p><progress id="pulseProgress" class="progress" max="'+qs.length+'" value="0"></progress><small id="pulseProgressText"></small><form id="pulseForm">'+qs.map(function(q){return input(q,(current.answers||{})[q.id])}).join('')+'<button type="button" id="submit">ส่งคำตอบ</button></form>';root.querySelector('form').addEventListener('input',saveLater);updateProgress();root.querySelector('#submit').addEventListener('click',submit)}catch(e){root.innerHTML='<p class="error">'+esc(e.message)+'</p><button type="button" id="retry">ลองใหม่</button>';root.querySelector('#retry').onclick=load}}
async function submit(){var btn=root.querySelector('#submit');if(!root.querySelector('form').reportValidity())return;if(!confirm('ยืนยันส่งคำตอบ? หลังส่งจะไม่สามารถแก้ไขได้'))return;btn.disabled=true;status.textContent='กำลังส่งคำตอบ…';try{await api('submitMemberPulseByToken',{answers:read()});root.innerHTML='<div class="done">ส่งคำตอบเรียบร้อยแล้ว ขอบคุณครับ 💛</div>';status.textContent=''}catch(e){status.textContent=e.message;btn.disabled=false}}
load()})();
</script></body></html>
